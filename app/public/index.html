<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinBank - Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f4f6f8;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            color: #123c69;
            font-size: 32px;
        }

        .logo p {
            color: #666;
            margin-top: 8px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #123c69;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 6px;
            background: #123c69;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0d2f52;
        }

        .mensagem {
            margin-top: 20px;
            padding: 12px;
            border-radius: 6px;
            display: none;
            text-align: center;
        }

        .erro {
            background: #fdeaea;
            color: #b42318;
        }

        .sucesso {
            background: #e8f5e9;
            color: #187a2f;
        }

        .footer {
            margin-top: 25px;
            text-align: center;
            color: #777;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <div class="logo">
                <h1>FinBank</h1>
                <p>Acesse sua conta com segurança</p>
            </div>

            <form id="loginForm">

                <div class="form-group">
                    <label for="cpf">CPF</label>
                    <input
                        type="text"
                        id="cpf"
                        name="cpf"
                        placeholder="Digite seu CPF"
                    >
                </div>

                <div class="form-group">
                    <label for="senha">Senha</label>
                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Digite sua senha"
                    >
                </div>

                <button type="submit">
                    Entrar
                </button>

            </form>

            <div id="mensagem" class="mensagem"></div>

            <div class="footer">
                FinBank © 2026 - Ambiente de demonstração
            </div>

        </div>

    </div>

    <script>

        const form = document.getElementById('loginForm');
        const mensagem = document.getElementById('mensagem');

        form.addEventListener('submit', async function(event) {

            event.preventDefault();

            const cpf = document.getElementById('cpf').value;
            const senha = document.getElementById('senha').value;

            mensagem.style.display = 'none';

            try {

                const resposta = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        cpf: cpf,
                        senha: senha
                    })
                });

                const dados = await resposta.json();

                mensagem.textContent = dados.mensagem;
                mensagem.style.display = 'block';

                if (dados.sucesso) {
                    mensagem.className = 'mensagem sucesso';
                } else {
                    mensagem.className = 'mensagem erro';
                }

            } catch (erro) {

                mensagem.textContent = 'Erro ao conectar com o servidor.';
                mensagem.className = 'mensagem erro';
                mensagem.style.display = 'block';

            }

        });

    </script>

</body>
</html>
